[package]
name    = "ail-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
## Enable the Z3 SMT solver backend.
##
## When this feature is compiled in, `ail verify --solver z3` routes proof
## obligations through `ail_verify::z3_solver::Z3Solver` instead of the
## conservative `SimpleSolver`.  System Z3 libraries are required at link time.
## Default builds intentionally omit this feature so CI on machines without Z3
## stays green.
z3-solver = ["ail-verify/z3-solver"]

[[bin]]
name = "ail"
path = "src/main.rs"

[dependencies]
ail-change   = { workspace = true }
ail-compiler = { workspace = true }
ail-coordinator = { workspace = true }
ail-context  = { workspace = true }
ail-core     = { workspace = true }
ail-package  = { workspace = true }
ail-remote   = { workspace = true }
ail-runtime  = { workspace = true }
ail-storage  = { workspace = true }
ail-verify   = { workspace = true }
blake3       = { workspace = true }
ciborium     = { workspace = true }
clap         = { workspace = true }
futures      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_fs  = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }

[lints]
workspace = true

[features]
crypto = ["dep:aes-gcm", "dep:argon2", "dep:x25519-dalek"]

[dependencies]
ail-change  = { workspace = true }
ail-context = { workspace = true }
ail-storage = { workspace = true }
aes-gcm       = { workspace = true, optional = true }

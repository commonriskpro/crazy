ciborium      = { workspace = true }
ed25519-dalek = { workspace = true }
rand          = { workspace = true }
serde         = { workspace = true }
x25519-dalek  = { workspace = true, optional = true }

[dev-dependencies]
ail-change  = { workspace = true }
ail-context = { workspace = true }
ail-core    = { workspace = true }
ail-storage = { workspace = true }
blake3      = { workspace = true }

[lints]
workspace = true

[workspace]
members = [
    "crates/ail-cli",
    "crates/ail-core",
    "crates/ail-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ail-core    = { path = "crates/ail-core" }
ail-testkit = { path = "crates/ail-testkit" }
clap        = { version = "4.5", features = ["derive"] }
assert_cmd  = "2.0"
predicates  = "3.1"
assert_fs   = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

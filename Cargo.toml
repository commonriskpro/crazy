[workspace]
members = [
    "crates/ail-change",
    "crates/ail-cli",
    "crates/ail-compiler",
    "crates/ail-context",
    "crates/ail-coordinator",
    "crates/ail-core",
    "crates/ail-dogfood",
    "crates/ail-package",
    "crates/ail-remote",
    "crates/ail-runtime",
    "crates/ail-storage",
    "crates/ail-stdlib",
    "crates/ail-testkit",
    "crates/ail-verify",
    "fuzz",
]
default-members = [
    "crates/ail-change",
    "crates/ail-cli",
    "crates/ail-compiler",
    "crates/ail-context",
    "crates/ail-coordinator",
    "crates/ail-core",
    "crates/ail-dogfood",
    "crates/ail-package",
    "crates/ail-remote",
    "crates/ail-runtime",
    "crates/ail-storage",
    "crates/ail-stdlib",
    "crates/ail-testkit",
    "crates/ail-verify",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ail-change      = { path = "crates/ail-change" }
ail-compiler    = { path = "crates/ail-compiler" }
ail-coordinator = { path = "crates/ail-coordinator" }
ail-context  = { path = "crates/ail-context" }
ail-core     = { path = "crates/ail-core" }
ail-dogfood  = { path = "crates/ail-dogfood" }
ail-package  = { path = "crates/ail-package" }
ail-remote   = { path = "crates/ail-remote" }
ail-runtime  = { path = "crates/ail-runtime" }
ail-storage  = { path = "crates/ail-storage" }
ail-stdlib   = { path = "crates/ail-stdlib" }
ail-testkit  = { path = "crates/ail-testkit" }
ail-verify   = { path = "crates/ail-verify" }
wasmtime     = "28"
wasm-encoder = "0.244"
wasmparser   = "0.244"
cranelift-codegen  = { version = "= 0.115.1", default-features = false, features = ["host-arch"] }
cranelift-frontend = "= 0.115.1"
cranelift-module   = "= 0.115.1"
cranelift-native   = "= 0.115.1"
cranelift-object   = "= 0.115.1"
tokio-postgres  = { version = "0.7", features = ["runtime"] }
z3              = { version = "0.20.0", features = [] }
aes-gcm         = "0.10"
argon2          = "0.5"
blake3          = "1.5"
ciborium        = "0.2"
ed25519-dalek   = { version = "2", features = ["rand_core"] }
rand            = "0.8"
x25519-dalek    = { version = "2", features = ["static_secrets"] }
clap        = { version = "4.5", features = ["derive"] }
futures     = "0.3"
tokio       = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tempfile    = "3.10"
assert_cmd  = "2.0"
predicates  = "3.1"
assert_fs   = "1.1"
tracing               = "0.1"
tracing-opentelemetry = "0.29"
opentelemetry         = "0.27"
opentelemetry_sdk     = "0.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

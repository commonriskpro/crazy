[workspace]
members = [
    "crates/ail-change",
    "crates/ail-cli",
    "crates/ail-core",
    "crates/ail-storage",
    "crates/ail-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ail-change  = { path = "crates/ail-change" }
ail-core    = { path = "crates/ail-core" }
ail-storage = { path = "crates/ail-storage" }
ail-testkit = { path = "crates/ail-testkit" }
blake3      = "1.5"
ciborium    = "0.2"
clap        = { version = "4.5", features = ["derive"] }
futures     = "0.3"
serde       = { version = "1", features = ["derive"] }
tempfile    = "3.10"
assert_cmd  = "2.0"
predicates  = "3.1"
assert_fs   = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

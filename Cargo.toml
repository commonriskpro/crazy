[workspace]
members = [
    "crates/ail-change",
    "crates/ail-cli",
    "crates/ail-compiler",
    "crates/ail-core",
    "crates/ail-runtime",
    "crates/ail-storage",
    "crates/ail-testkit",
    "crates/ail-verify",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ail-change   = { path = "crates/ail-change" }
ail-compiler = { path = "crates/ail-compiler" }
ail-core     = { path = "crates/ail-core" }
ail-runtime  = { path = "crates/ail-runtime" }
ail-storage  = { path = "crates/ail-storage" }
ail-testkit  = { path = "crates/ail-testkit" }
ail-verify   = { path = "crates/ail-verify" }
wasmtime     = "28"
wasm-encoder = "0.244"
wasmparser   = "0.244"
blake3      = "1.5"
ciborium    = "0.2"
clap        = { version = "4.5", features = ["derive"] }
futures     = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tempfile    = "3.10"
assert_cmd  = "2.0"
predicates  = "3.1"
assert_fs   = "1.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

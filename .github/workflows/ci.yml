name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Check process scripts syntax
        run: |
          bash -n \
            scripts/release-preflight.sh \
            scripts/release-metadata-gate-smoke.sh \
            scripts/release-preflight-marker-smoke.sh \
            scripts/docs-onboarding-smoke.sh \
            scripts/docs-troubleshooting-smoke.sh \
            scripts/docs-language-reference-smoke.sh \
            scripts/docs-compatibility-smoke.sh \
            scripts/docs-stdlib-reference-smoke.sh \
            scripts/docs-package-reference-smoke.sh \
            scripts/docs-performance-smoke.sh \
            scripts/docs-security-smoke.sh \
            scripts/docs-tooling-reference-smoke.sh \
            scripts/pr-validation-smoke.sh \
            scripts/tag-release-gate-smoke.sh \
            scripts/tag-release.sh
          python3 -m py_compile scripts/pr-validation.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Check PR metadata validation
        run: ./scripts/pr-validation-smoke.sh

      - name: Check onboarding docs
        run: ./scripts/docs-onboarding-smoke.sh

      - name: Check troubleshooting docs
        run: ./scripts/docs-troubleshooting-smoke.sh

      - name: Check language reference docs
        run: ./scripts/docs-language-reference-smoke.sh

      - name: Check compatibility docs
        run: ./scripts/docs-compatibility-smoke.sh

      - name: Check stdlib reference docs
        run: ./scripts/docs-stdlib-reference-smoke.sh

      - name: Check package reference docs
        run: ./scripts/docs-package-reference-smoke.sh

      - name: Check performance docs
        run: ./scripts/docs-performance-smoke.sh

      - name: Check security docs
        run: ./scripts/docs-security-smoke.sh

      - name: Check tooling reference docs
        run: ./scripts/docs-tooling-reference-smoke.sh

      - name: Check release metadata
        run: |
          ./scripts/tag-release-gate-smoke.sh
          ./scripts/release-metadata-gate-smoke.sh
          VERSION="$(awk '/^\[workspace\.package\]$/ { p = 1; next } /^\[/ { p = 0 } p && /^version/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          export VERSION
          ./scripts/release-preflight.sh --allow-unreleased

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0

      - name: Cache cargo bin (audit tools)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-deny-audit-v1

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo deny check
        run: cargo deny check

      - name: Run cargo audit
        run: cargo audit

  fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo bin (fuzz tools)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-fuzz-v1

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz &> /dev/null; then
            cargo install cargo-fuzz --locked
          fi

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
        working-directory: ${{ github.workspace }}

      - name: Fuzz fuzz_parser
        run: cargo +nightly fuzz run fuzz_parser -- -max_total_time=30
        working-directory: ${{ github.workspace }}

      - name: Fuzz fuzz_cbor
        run: cargo +nightly fuzz run fuzz_cbor -- -max_total_time=30
        working-directory: ${{ github.workspace }}

      - name: Fuzz fuzz_runtime
        run: cargo +nightly fuzz run fuzz_runtime -- -max_total_time=30
        working-directory: ${{ github.workspace }}
